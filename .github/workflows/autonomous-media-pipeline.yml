name: Autonomous Media Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 8,12,16,20,0 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping scheduled/manual/push runs from processing the same source at once.
concurrency:
  group: autonomous-media-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
      YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          echo "[setup] Installing FFmpeg"
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Python dependencies
        run: |
          echo "[setup] Installing Python dependencies"
          python -m pip install --upgrade pip
          pip install -r autonomous-media-pipeline/requirements.txt
      - name: Validate configuration without exposing secrets
        run: |
          echo "[config] SOURCE_CHANNELS configured: $([[ -n "$SOURCE_CHANNELS" ]] && echo yes || echo no)"
          echo "[config] YOUTUBE_TOKEN_JSON configured: $([[ -n "$YOUTUBE_TOKEN_JSON" ]] && echo yes || echo no)"
          echo "[config] Secret values are never printed."
      - name: Download, process, and publish
        run: |
          set -euo pipefail
          python autonomous-media-pipeline/scripts/process_and_publish.py
      - name: Clean temporary media and caches
        if: always()
        run: |
          echo "[cleanup] Removing generated media and caches"
          rm -rf ./*.mp4 ./*.part "$HOME/.cache"
          find . -type f \( -name '*.mp4' -o -name '*.part' -o -name '*.ytdl' \) -delete
          rm -rf autonomous-media-pipeline/.cache autonomous-media-pipeline/__pycache__
          echo "[cleanup] Cleanup step completed"
