name: Autonomous Media Pipeline

on:
  push:
    branches: [ main, fix/media-pipeline-safe-mode ]
  schedule:
    # Five runs per UTC day: 00:00, 08:00, 12:00, 16:00, and 20:00.
    - cron: '0 8,12,16,20,0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the verified YouTube channel (requires OAuth credentials)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: autonomous-media-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_TARGET_HANDLE: "@Alyzopair"
      YOUTUBE_MADE_FOR_KIDS: "false"
      SHORTS_TOPIC: ${{ vars.SHORTS_TOPIC }}
      SHORTS_LANGUAGE: ${{ vars.SHORTS_LANGUAGE || 'ar' }}
      SHORTS_DURATION: ${{ vars.SHORTS_DURATION || '45' }}
      PIPELINE_OUTPUT_DIR: ${{ github.workspace }}/autonomous-media-pipeline/artifacts
      CHANNEL_NAME: "Alyzopair"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: autonomous-media-pipeline/requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r autonomous-media-pipeline/requirements.txt
      - name: Verify media pipeline CLI imports
        run: python autonomous-media-pipeline/scripts/process_and_publish.py --help
      - name: Render in zero-credential dry-run mode
        if: ${{ !inputs.publish }}
        run: |
          set -euo pipefail
          python autonomous-media-pipeline/scripts/process_and_publish.py --dry-run

      - name: Validate YouTube OAuth before explicit publishing
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "[config] OAuth token JSON is configured."
          elif [ -n "$YOUTUBE_REFRESH_TOKEN" ] && [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "[config] Refresh-token OAuth credentials are configured."
          else
            echo "::error::Publishing was requested, but complete YouTube OAuth credentials are missing."
            exit 1
          fi

      - name: Publish only after explicit manual approval
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          python autonomous-media-pipeline/scripts/process_and_publish.py

      - name: Upload locally rendered video for review
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: clt-platform-dry-run-video
          path: autonomous-media-pipeline/artifacts/processed.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Clean temporary media and caches
        if: always()
        run: |
          echo "[cleanup] Removing generated temporary media and Python caches"
          rm -rf autonomous-media-pipeline/.cache autonomous-media-pipeline/__pycache__
          find autonomous-media-pipeline -type f \( -name '*.part' -o -name '*.ytdl' -o -name '*.pyc' \) -delete
          echo "[cleanup] Cleanup step completed"
