name: Autonomous Media Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    # Five runs per UTC day: 00:00, 08:00, 12:00, 16:00, and 20:00.
    - cron: '0 8,12,16,20,0 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping scheduled/manual/push runs from processing the same source at once.
concurrency:
  group: autonomous-media-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_TARGET_HANDLE: "@Alyzopair"
      YOUTUBE_MADE_FOR_KIDS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          echo "[setup] Installing FFmpeg"
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Python dependencies
        run: |
          echo "[setup] Installing Python dependencies"
          python -m pip install --upgrade pip
          pip install -r autonomous-media-pipeline/requirements.txt
      - name: Validate configuration without exposing secrets
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_CHANNELS" ] && ! grep -Eqv '^[[:space:]]*(#.*)?
      - name: Download, process, and publish
        run: |
          set -euo pipefail
          python autonomous-media-pipeline/scripts/process_and_publish.py
      - name: Clean temporary media and caches
        if: always()
        run: |
          echo "[cleanup] Removing generated temporary media and Python caches"
          rm -rf "$HOME/.cache" autonomous-media-pipeline/.cache autonomous-media-pipeline/__pycache__
          find autonomous-media-pipeline -type f \( -name '*.part' -o -name '*.ytdl' -o -name '*.pyc' \) -delete
          echo "[cleanup] Cleanup step completed"
 autonomous-media-pipeline/config/authorized_sources.txt; then
            echo "::error::No authorized sources configured. Set SOURCE_CHANNELS or populate config/authorized_sources.txt."
            exit 1
          fi
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "[config] Legacy OAuth token JSON is configured."
          elif [ -n "$YOUTUBE_REFRESH_TOKEN" ] && [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ]; then
            echo "[config] Refresh-token OAuth configuration is present."
          else
            echo "::error::Configure YOUTUBE_TOKEN_JSON or all of YOUTUBE_REFRESH_TOKEN, YOUTUBE_CLIENT_ID, and YOUTUBE_CLIENT_SECRET."
            exit 1
          fi
          echo "[config] Configuration validated without printing secret values."
      - name: Download, process, and publish
        run: |
          set -euo pipefail
          python autonomous-media-pipeline/scripts/process_and_publish.py
      - name: Clean temporary media and caches
        if: always()
        run: |
          echo "[cleanup] Removing generated temporary media and Python caches"
          rm -rf "$HOME/.cache" autonomous-media-pipeline/.cache autonomous-media-pipeline/__pycache__
          find autonomous-media-pipeline -type f \( -name '*.part' -o -name '*.ytdl' -o -name '*.pyc' \) -delete
          echo "[cleanup] Cleanup step completed"
