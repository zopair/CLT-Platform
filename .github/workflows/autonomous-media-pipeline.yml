name: Autonomous Media Pipeline

on:
  schedule:
    - cron: '0 8,12,16,20,0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
      YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r autonomous-media-pipeline/requirements.txt
      - name: Process authorized source and upload privately
        run: python autonomous-media-pipeline/scripts/process_and_publish.py
      - name: Clean temporary media
        if: always()
        run: find . -type f \( -name '*.mp4' -o -name '*.part' -o -name '*.ytdl' \) -delete
